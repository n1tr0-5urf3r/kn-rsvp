[package]
name = "rsvp"
version = "1.5.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/n1tr0-5urf3r/kn-rsvp"

[[bin]]
name = "rsvp"
path = "src/main.rs"

[[bin]]
name = "openapi-export"
path = "src/bin/openapi-export.rs"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.23.1"
chrono = { version = "0.4", features = ["serde"] }
openidconnect = "4"
rand = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "query", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower-cookies = "0.11"
tower-http = { version = "0.7", features = ["cors", "trace", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9", features = ["axum", "vendored"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
wiremock = "0.6"
